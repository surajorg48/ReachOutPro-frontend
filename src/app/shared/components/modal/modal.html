@if (isOpen) {
  <div class="modal-overlay" (click)="onOverlayClick()">
    <div class="modal" [style.maxWidth]="maxWidth" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">{{ title }}</div>
        <button class="btn btn-ghost btn-sm btn-icon" (click)="close.emit()">✕</button>
      </div>
      <ng-content />
    </div>
  </div>
}
